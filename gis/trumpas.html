<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <title>Lietuvos GIS</title>
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #juosta { padding: 6px; background: #eee; }
    arcgis-scene { display: block; height: calc(100% - 70px); }
  </style>
</head>
<body>
  <div id="juosta">
    <select id="miestas"></select> <button id="iMiesta">Priartinti prie miesto</button>
    <button id="didziausias">Didžiausias miestas</button>
    <button id="siauliai">Šiauliai</button> |
    <button id="uzklausa">Miestai &gt; 50 000 gyv.</button>
    <button id="diena">Dienos ciklas</button> |
    Buferis <input id="buferisKm" type="number" value="50" style="width:50px"> km
    <div id="info">Spustelėkite žemėlapį – bus nubrėžtas buferis.</div>
  </div>

  <!-- 3D žemėlapis ir valdikliai -->
  <arcgis-scene basemap="topo-vector" ground="world-elevation">
    <arcgis-zoom slot="top-left"></arcgis-zoom>
    <arcgis-home slot="top-left"></arcgis-home>
    <arcgis-compass slot="top-left"></arcgis-compass>
    <arcgis-basemap-toggle slot="bottom-right" next-basemap="hybrid"></arcgis-basemap-toggle>
    <arcgis-legend slot="bottom-left"></arcgis-legend>
    <arcgis-search slot="top-right" include-default-sources-disabled></arcgis-search>
  </arcgis-scene>

  <script type="module">
    const [FeatureLayer, Graphic, GraphicsLayer, Point, buferis] = await $arcgis.import([
      "@arcgis/core/layers/FeatureLayer.js", "@arcgis/core/Graphic.js", "@arcgis/core/layers/GraphicsLayer.js",
      "@arcgis/core/geometry/Point.js", "@arcgis/core/geometry/operators/geodesicBufferOperator.js"
    ]);
    const zemelapis = document.querySelector("arcgis-scene");
    const info = document.getElementById("info");
    await zemelapis.viewOnReady();
    zemelapis.goTo({ center: [23.9, 55.0], zoom: 8, tilt: 50 });   // pradinis vaizdas: Lietuva įstrižai

    // ---------- Miestai: pavadinimas, gyventojai, ilguma, platuma ----------
    const miestai = [
      ["Vilnius", 592000, 25.28, 54.69], ["Kaunas", 304000, 23.90, 54.90], ["Klaipėda", 158000, 21.14, 55.70],
      ["Šiauliai", 107000, 23.31, 55.93], ["Panevėžys", 86000, 24.36, 55.73], ["Alytus", 50000, 24.05, 54.40],
      ["Marijampolė", 35500, 23.35, 54.56], ["Utena", 25500, 25.60, 55.50], ["Telšiai", 22000, 22.25, 55.98],
      ["Palanga", 17500, 21.07, 55.92]
    ];

    // ---------- Sluoksnis su miestais ----------
    const sluoksnis = new FeatureLayer({
      title: "Lietuvos miestai",
      objectIdField: "id",
      fields: [
        { name: "id", type: "oid" },
        { name: "pavadinimas", type: "string" },
        { name: "gyventojai", type: "integer" }
      ],
      source: miestai.map((m, i) => new Graphic({
        geometry: { type: "point", longitude: m[2], latitude: m[3] },
        attributes: { id: i, pavadinimas: m[0], gyventojai: m[1] }
      })),
      popupTemplate: { title: "{pavadinimas}", content: "Gyventojų: {gyventojai}" },
      // Vizualizacija: kūgis, kuo daugiau gyventojų – tuo aukštesnis
      renderer: {
        type: "simple",
        symbol: { type: "point-3d", symbolLayers: [{ type: "object", resource: { primitive: "cone" }, width: 10000, material: { color: "green" } }] },
        visualVariables: [
          { type: "size", field: "gyventojai", axis: "height", stops: [{ value: 3000, size: 3000 }, { value: 600000, size: 60000 }] },
          { type: "size", axis: "width-and-depth", useSymbolValue: true }
        ]
      }
    });
    zemelapis.map.add(sluoksnis);

    // ---------- 3D grafika: besmegenis iš 5 dalių ----------
    function dalis(forma, spalva, plotis, aukstis, z) {
      return new Graphic({
        geometry: { type: "point", longitude: 22.9, latitude: 55.0, z: z },
        symbol: { type: "point-3d", symbolLayers: [{ type: "object", resource: { primitive: forma },
          material: { color: spalva }, width: plotis, depth: plotis, height: aukstis, anchor: "bottom" }] }
      });
    }
    const besmegenis = new GraphicsLayer({ title: "Besmegenis", elevationInfo: { mode: "relative-to-ground" } });
    besmegenis.addMany([
      dalis("sphere", "white", 16000, 16000, 0),        // 1 apatinis rutulys
      dalis("sphere", "white", 12000, 12000, 14000),    // 2 vidurinis rutulys
      dalis("sphere", "white", 8000, 8000, 25000),      // 3 galva
      dalis("cylinder", "black", 10000, 1000, 32000),   // 4 kepurės kraštas
      dalis("cylinder", "black", 6000, 6000, 33000)     // 5 kepurė
    ]);
    zemelapis.map.add(besmegenis);

    // ---------- Paieška: miestai + adresai Lietuvoje ----------
    const paieska = document.querySelector("arcgis-search");
    await paieska.componentOnReady();
    paieska.sources = [
      { layer: sluoksnis, searchFields: ["pavadinimas"], displayField: "pavadinimas", exactMatch: false, name: "Miestai" },
      { url: "https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer", singleLineFieldName: "SingleLine",
        countryCode: "LTU", name: "Adresai" }
    ];

    // ---------- Analizė: buferis ir miestai jame ----------
    const buferioSluoksnis = new GraphicsLayer();
    zemelapis.map.add(buferioSluoksnis);
    await buferis.load();
    zemelapis.addEventListener("arcgisViewClick", async (e) => {
      const km = Number(document.getElementById("buferisKm").value);
      const zona = buferis.execute(e.detail.mapPoint, km, { unit: "kilometers" });
      buferioSluoksnis.removeAll();
      buferioSluoksnis.add(new Graphic({ geometry: zona, symbol: { type: "simple-fill", color: [255, 0, 0, 0.3] } }));
      const rez = await sluoksnis.queryFeatures({ geometry: zona, outFields: ["pavadinimas"] });
      const pavadinimai = rez.features.map((f) => f.attributes.pavadinimas);
      info.textContent = "Buferyje: " + (pavadinimai.join(", ") || "miestų nėra");
    });

    // ---------- Užklausa: miestai, kuriuose daugiau nei 50 000 gyventojų ----------
    document.getElementById("uzklausa").onclick = async () => {
      const rez = await sluoksnis.queryFeatures({ where: "gyventojai > 50000", outFields: ["pavadinimas"] });
      info.textContent = "Rasta: " + rez.features.map((f) => f.attributes.pavadinimas).join(", ");
    };

    // ---------- Trys priartinimo mygtukai ----------
    function priartinti(ilguma, platuma) {
      zemelapis.goTo({ target: new Point({ longitude: ilguma, latitude: platuma }), zoom: 10, tilt: 60 });
    }
    miestai.forEach((m) => document.getElementById("miestas").add(new Option(m[0])));

    document.getElementById("iMiesta").onclick = () => {
      const m = miestai.find((x) => x[0] === document.getElementById("miestas").value);
      priartinti(m[2], m[3]);
    };
    document.getElementById("didziausias").onclick = async () => {
      const rez = await sluoksnis.queryFeatures({ where: "1=1", orderByFields: ["gyventojai DESC"], num: 1, returnGeometry: true });
      const taskas = rez.features[0].geometry;
      priartinti(taskas.longitude, taskas.latitude);
    };
    document.getElementById("siauliai").onclick = () => priartinti(23.31, 55.93);

    // ---------- Realistinė aplinka: saulė kyla ir leidžiasi ----------
    zemelapis.environment.starsEnabled = true;
    zemelapis.environment.lighting = { type: "sun", directShadowsEnabled: true };
    let minutes = 0;
    document.getElementById("diena").onclick = () => {
      document.getElementById("diena").disabled = true;   // kad nepaleistume du kartus
      setInterval(() => {
        minutes = (minutes + 10) % 1440;                                     // 1440 min = para
        zemelapis.environment.lighting.date = new Date(2026, 5, 21, 0, minutes);  // birželio 21 d.
        info.textContent = "Laikas: " + Math.floor(minutes / 60) + " val.";
      }, 100);
    };
  </script>
</body>
</html>
