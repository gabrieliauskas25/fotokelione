<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>1. Grouping Animations</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden}#c{width:100%;height:100%}
#ui{position:absolute;top:10px;left:10px}button{margin:2px;padding:6px 10px}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <b style="color:white">Grupe 1:</b>
  <button onclick="group1.play(true)">Play</button>
  <button onclick="group1.pause()">Pause</button>
  <button onclick="group1.stop()">Stop</button><br>
  <b style="color:white">Grupe 2:</b>
  <button onclick="group2.play(true)">Play</button>
  <button onclick="group2.pause()">Pause</button>
  <button onclick="group2.stop()">Stop</button>
</div>
<script>
const canvas = document.getElementById("c");
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 15, BABYLON.Vector3.Zero(), scene);
camera.attachControl(canvas, true);
new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);

// Objektai
const mesh1 = BABYLON.MeshBuilder.CreateBox("mesh1", {size: 1.5}, scene);
mesh1.position.x = -4;
const mesh2 = BABYLON.MeshBuilder.CreateSphere("mesh2", {diameter: 1}, scene);
const mesh3 = BABYLON.MeshBuilder.CreateSphere("mesh3", {diameter: 1}, scene);
const mesh4 = BABYLON.MeshBuilder.CreateSphere("mesh4", {diameter: 1}, scene);
mesh2.position.x = 1; mesh3.position.x = 3; mesh4.position.x = 5;

const fps = 30;

// animation1 - sukimasis aplink Y
const animation1 = new BABYLON.Animation("rotY", "rotation.y", fps,
  BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
animation1.setKeys([{frame:0, value:0}, {frame:60, value:2*Math.PI}]);

// animation2 - mastelio keitimas
const animation2 = new BABYLON.Animation("scale", "scaling", fps,
  BABYLON.Animation.ANIMATIONTYPE_VECTOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
animation2.setKeys([
  {frame:0, value:new BABYLON.Vector3(1,1,1)},
  {frame:30, value:new BABYLON.Vector3(1.5,1.5,1.5)},
  {frame:60, value:new BABYLON.Vector3(1,1,1)}]);

// animation3 - judejimas aukstyn/zemyn
const animation3 = new BABYLON.Animation("posY", "position.y", fps,
  BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
animation3.setKeys([{frame:0, value:0}, {frame:30, value:2}, {frame:60, value:0}]);

// animation4 - soliukas (sokinejimas) - naudojama keliems objektams
const animation4 = new BABYLON.Animation("jump", "position.y", fps,
  BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
animation4.setKeys([{frame:0, value:0}, {frame:15, value:-2}, {frame:30, value:0}]);

// GRUPE 1 - trys animacijos vienam objektui (mesh1)
const group1 = new BABYLON.AnimationGroup("group1");
group1.addTargetedAnimation(animation1, mesh1);
group1.addTargetedAnimation(animation2, mesh1);
group1.addTargetedAnimation(animation3, mesh1);

// GRUPE 2 - viena animacija trims objektams (mesh2, mesh3, mesh4)
const group2 = new BABYLON.AnimationGroup("group2");
group2.addTargetedAnimation(animation4, mesh2);
group2.addTargetedAnimation(animation4, mesh3);
group2.addTargetedAnimation(animation4, mesh4);
group2.speedRatio = 2; // grupe 2 groja 2x greiciau

group1.play(true);
group2.play(true);

engine.runRenderLoop(() => scene.render());
window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
