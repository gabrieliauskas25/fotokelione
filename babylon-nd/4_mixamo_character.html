<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>4. Mixamo animuotas veikejas</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden}#c{width:100%;height:100%}
#help{position:absolute;top:10px;left:10px;color:white;font-family:sans-serif;background:rgba(0,0,0,.5);padding:8px}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help">
  W - eiti pirmyn, S - eiti atgal<br>
  A / D - suktis, Shift - begti greiciau<br>
  B - sokti (Samba)
</div>
<script>
// Modelis HVGirl.glb - Mixamo veikejas su Mixamo animacijomis
// (Idle, Walking, WalkingBack, Samba), naudojamas Babylon.js dokumentacijoje
// "Animated Character". Valdomas klaviaturos mygtukais.
const canvas = document.getElementById("c");
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);

const camera = new BABYLON.ArcRotateCamera("cam", Math.PI/2, Math.PI/2.5, 10, new BABYLON.Vector3(0, 1, 0), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 2; camera.upperRadiusLimit = 15;
new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 50, height: 50}, scene);
const gmat = new BABYLON.StandardMaterial("g", scene);
gmat.diffuseColor = new BABYLON.Color3(0.4, 0.6, 0.4);
ground.material = gmat;

// 1. Klaviaturos busenos sekimas
const inputMap = {};
scene.actionManager = new BABYLON.ActionManager(scene);
scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger,
  evt => { inputMap[evt.sourceEvent.key.toLowerCase()] = evt.sourceEvent.type === "keydown"; }));
scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger,
  evt => { inputMap[evt.sourceEvent.key.toLowerCase()] = evt.sourceEvent.type === "keydown"; }));

// 2. Modelio ikelimas
BABYLON.SceneLoader.ImportMesh("", "https://assets.babylonjs.com/meshes/", "HVGirl.glb", scene, function (meshes) {
  const hero = meshes[0];
  hero.scaling.scaleInPlace(0.1);       // modelis per didelis - sumaziname
  camera.target = hero;                 // kamera seka veikeja

  const heroSpeed = 0.03;
  const heroSpeedBackwards = 0.01;
  const heroRotationSpeed = 0.1;
  let animating = true;

  // 3. Animaciju grupes is modelio
  const walkAnim = scene.getAnimationGroupByName("Walking");
  const walkBackAnim = scene.getAnimationGroupByName("WalkingBack");
  const idleAnim = scene.getAnimationGroupByName("Idle");
  const sambaAnim = scene.getAnimationGroupByName("Samba");

  // 4. Kiekviename kadre tikriname mygtukus
  scene.onBeforeRenderObservable.add(() => {
    let keydown = false;
    const speedMul = inputMap["shift"] ? 2.5 : 1;

    if (inputMap["w"]) { hero.moveWithCollisions(hero.forward.scaleInPlace(heroSpeed * speedMul)); keydown = true; }
    if (inputMap["s"]) { hero.moveWithCollisions(hero.forward.scaleInPlace(-heroSpeedBackwards)); keydown = true; }
    if (inputMap["a"]) { hero.rotate(BABYLON.Vector3.Up(), -heroRotationSpeed); keydown = true; }
    if (inputMap["d"]) { hero.rotate(BABYLON.Vector3.Up(), heroRotationSpeed); keydown = true; }
    if (inputMap["b"]) { keydown = true; }

    // 5. Animacijos parinkimas pagal paspausta mygtuka
    if (keydown) {
      if (!animating) {
        animating = true;
        if (inputMap["s"]) {
          walkBackAnim.start(true, 1.0, walkBackAnim.from, walkBackAnim.to, false);
        } else if (inputMap["b"]) {
          sambaAnim.start(true, 1.0, sambaAnim.from, sambaAnim.to, false);
        } else {
          walkAnim.start(true, speedMul, walkAnim.from, walkAnim.to, false);
        }
      }
    } else if (animating) {
      // jokio mygtuko - stovi (Idle), kitos animacijos sustabdomos
      idleAnim.start(true, 1.0, idleAnim.from, idleAnim.to, false);
      sambaAnim.stop();
      walkAnim.stop();
      walkBackAnim.stop();
      animating = false;
    }
  });
});

engine.runRenderLoop(() => scene.render());
window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
