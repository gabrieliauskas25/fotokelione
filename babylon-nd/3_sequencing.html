<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3. Sequencing Animations</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden}#c{width:100%;height:100%}
button{position:absolute;top:10px;left:10px;padding:6px 10px}</style>
</head>
<body>
<canvas id="c"></canvas>
<button onclick="start()">Paleisti is naujo</button>
<script>
/*
  SEQUENCE TIMETABLE (frameRate = 20, 1 sekunde = 20 kadru)
  ------------------------------------------------------------------
  Performer      | Veiksmas                     | Pradzia | Pabaiga
  ------------------------------------------------------------------
  1. box         | nuvaziuoja i desine          |  0 s    |  2 s
  2. sphere      | pasoka aukstyn               |  2 s    |  3 s
  3. cylinder    | apsisuka                     |  3 s    |  5 s
  4. torus       | padideja ir sumazeja         |  5 s    |  6 s
  5. cone        | nukrenta zemyn               |  6 s    |  8 s
  5. kamera      | (nejuda)                     |   -     |   -
  ------------------------------------------------------------------
  Visa seka trunka 8 s. Kiekvienas performer'is laukia savo eiles -
  iki savo pradzios jis stovi vietoje (tos pacios reiksmes raktai).
*/
const canvas = document.getElementById("c");
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 18, BABYLON.Vector3.Zero(), scene);
camera.attachControl(canvas, true);
new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);
BABYLON.MeshBuilder.CreateGround("ground", {width: 20, height: 10}, scene).position.y = -0.5;

const frameRate = 20;
const s = frameRate;      // 1 sekunde kadrais
const end = 8 * s;        // visos sekos pabaiga

// 5 performeriai
const box = BABYLON.MeshBuilder.CreateBox("box", {}, scene);
box.position = new BABYLON.Vector3(-6, 0, 0);
const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", {}, scene);
sphere.position = new BABYLON.Vector3(-3, 0, 0);
const cylinder = BABYLON.MeshBuilder.CreateCylinder("cylinder", {height: 1.5}, scene);
cylinder.position = new BABYLON.Vector3(0, 0, 0);
const torus = BABYLON.MeshBuilder.CreateTorus("torus", {diameter: 1.2, thickness: 0.3}, scene);
torus.position = new BABYLON.Vector3(3, 0, 0);
const cone = BABYLON.MeshBuilder.CreateCylinder("cone", {diameterTop: 0, height: 1.5}, scene);
cone.position = new BABYLON.Vector3(6, 4, 0);

// Pagalbine funkcija animacijai sukurti
function makeAnim(name, prop, type, keys) {
  const a = new BABYLON.Animation(name, prop, frameRate, type, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
  a.setKeys(keys);
  return a;
}
const F = BABYLON.Animation.ANIMATIONTYPE_FLOAT;
const V = BABYLON.Animation.ANIMATIONTYPE_VECTOR3;

// 1. box: 0-2 s juda X kryptimi
const boxAnim = makeAnim("boxMove", "position.x", F, [
  {frame: 0, value: -6}, {frame: 2*s, value: -4}, {frame: end, value: -4}]);

// 2. sphere: 2-3 s pasoka
const sphereAnim = makeAnim("sphereJump", "position.y", F, [
  {frame: 0, value: 0}, {frame: 2*s, value: 0}, {frame: 2.5*s, value: 3},
  {frame: 3*s, value: 0}, {frame: end, value: 0}]);

// 3. cylinder: 3-5 s apsisuka
const cylAnim = makeAnim("cylRotate", "rotation.z", F, [
  {frame: 0, value: 0}, {frame: 3*s, value: 0}, {frame: 5*s, value: 2*Math.PI},
  {frame: end, value: 2*Math.PI}]);

// 4. torus: 5-6 s padideja/sumazeja
const torusAnim = makeAnim("torusScale", "scaling", V, [
  {frame: 0, value: new BABYLON.Vector3(1,1,1)}, {frame: 5*s, value: new BABYLON.Vector3(1,1,1)},
  {frame: 5.5*s, value: new BABYLON.Vector3(2,2,2)}, {frame: 6*s, value: new BABYLON.Vector3(1,1,1)},
  {frame: end, value: new BABYLON.Vector3(1,1,1)}]);

// 5. cone: 6-8 s nukrenta
const coneAnim = makeAnim("coneFall", "position.y", F, [
  {frame: 0, value: 4}, {frame: 6*s, value: 4}, {frame: 8*s, value: 0.25}]);

function start() {
  scene.stopAllAnimations();
  // visi paleidziami tuo paciu metu - eiliskuma nustato raktu kadrai (timetable)
  scene.beginDirectAnimation(box, [boxAnim], 0, end, false);
  scene.beginDirectAnimation(sphere, [sphereAnim], 0, end, false);
  scene.beginDirectAnimation(cylinder, [cylAnim], 0, end, false);
  scene.beginDirectAnimation(torus, [torusAnim], 0, end, false);
  scene.beginDirectAnimation(cone, [coneAnim], 0, end, false);
}
start();

engine.runRenderLoop(() => scene.render());
window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
