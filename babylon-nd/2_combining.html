<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>2. Combining Animations</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden}#c{width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 12, BABYLON.Vector3.Zero(), scene);
camera.attachControl(canvas, true);
new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);

const box = BABYLON.MeshBuilder.CreateBox("box", {size: 1}, scene);
const frameRate = 10;

// anim1 - judejimas kairen-desinen (X asis)
const anim1 = new BABYLON.Animation("xSlide", "position.x", frameRate,
  BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
anim1.setKeys([
  {frame: 0, value: 2},
  {frame: frameRate, value: -2},
  {frame: 2 * frameRate, value: 2}]);

// anim2 - sukimasis aplink X asi
const anim2 = new BABYLON.Animation("xRot", "rotation.x", frameRate,
  BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
anim2.setKeys([
  {frame: 0, value: 0},
  {frame: frameRate, value: Math.PI},
  {frame: 2 * frameRate, value: 2 * Math.PI}]);

// anim3 - spalvos keitimas
box.material = new BABYLON.StandardMaterial("mat", scene);
const anim3 = new BABYLON.Animation("color", "material.diffuseColor", frameRate,
  BABYLON.Animation.ANIMATIONTYPE_COLOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
anim3.setKeys([
  {frame: 0, value: new BABYLON.Color3(1,0,0)},
  {frame: frameRate, value: new BABYLON.Color3(0,0,1)},
  {frame: 2 * frameRate, value: new BABYLON.Color3(1,0,0)}]);

// SUJUNGIMAS - visos animacijos paleidziamos kartu vienam objektui
scene.beginDirectAnimation(box, [anim1, anim2, anim3], 0, 2 * frameRate, true);

engine.runRenderLoop(() => scene.render());
window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
